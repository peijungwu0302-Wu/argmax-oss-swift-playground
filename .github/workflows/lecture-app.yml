name: Lecture App Validation
on:
  push:
    branches: [playground-compatible, 'release/**', main]
    tags: ['v*']
    paths: ['Apps/**', 'AppBuild/**', 'AppTests/**', '.github/workflows/lecture-app.yml', 'Deliverables/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  playground-package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Playground sources in Xcode (not the iPad Playgrounds resolver)
        working-directory: Apps/LectureTranscriber.swiftpm
        run: |
          set -o pipefail
          xcodebuild -list
          python3 ../../AppBuild/check_playground_dependencies.py
          xcodebuild -scheme LectureTranscriber -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/PlaygroundBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/playground-device.log"
      # User authorized universal iPhone/iPad updates starting with 1.5.0.
      - name: Build and launch Playground sources on simulator
        working-directory: Apps/LectureTranscriber.swiftpm
        run: |
          set -o pipefail
          xcodebuild -scheme LectureTranscriber -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/PlaygroundBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/playground-simulator.log"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPad" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/PlaygroundBuild/Build/Products/Debug-iphonesimulator/課堂逐字稿.app"
          xcrun simctl launch "$DEVICE_ID" com.peijungwu0302.lecturetranscriber
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/playground-launch.png"
      - name: Report package build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, pathlib
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('playground-*.log'):
              for line in p.read_text(errors='replace').splitlines():
                  if 'error:' in line.lower():
                      print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-package-log
          path: |
            ${{ runner.temp }}/playground-*.log
            ${{ runner.temp }}/playground-launch.png
  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Persistence and export checks
        run: |
          set -o pipefail
          swiftc Apps/LectureTranscriber.swiftpm/Sources/Session.swift AppTests/main.swift -o "$RUNNER_TEMP/session-tests" 2>&1 | tee "$RUNNER_TEMP/lecture-persistence.log"
          "$RUNNER_TEMP/session-tests" 2>&1 | tee -a "$RUNNER_TEMP/lecture-persistence.log"
      - name: Check AAC archive on macOS
        # The desktop codec check catches archive errors before simulator startup.
        run: |
          set -o pipefail
          swiftc Apps/LectureTranscriber.swiftpm/Sources/Session.swift Apps/LectureTranscriber.swiftpm/Sources/StoredAudio.swift AppTests/AudioArchive/main.swift -o "$RUNNER_TEMP/audio-tests" 2>&1 | tee "$RUNNER_TEMP/lecture-audio.log"
          "$RUNNER_TEMP/audio-tests" 2>&1 | tee -a "$RUNNER_TEMP/lecture-audio.log"
      - name: Type-check App Playground manifest
        run: |
          XCODE_ROOT="$(xcode-select -p)/../.."
          MODULE="$(find "$XCODE_ROOT" -path '*/ManifestAPI/AppleProductTypes.swiftmodule' -print -quit)"
          test -n "$MODULE"
          xcrun swiftc -typecheck -I "$(dirname "$MODULE")" -package-description-version 5.10.0 Apps/LectureTranscriber.swiftpm/Package.swift
      - name: Generate Xcode validation project
        run: |
          brew install xcodegen
          xcodegen generate --spec AppBuild/project.yml
      - name: Build source-only speech engines on iOS
        run: |
          set -o pipefail
          xcodebuild -project AppBuild/LectureTranscriber.xcodeproj -scheme LectureTranscriber -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/LectureBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/lecture-build.log"
      - name: Launch app on iPad simulator
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPad" in d["name"]))')
          xcodebuild -project AppBuild/LectureTranscriber.xcodeproj -scheme LectureTranscriber -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/LectureBuild" -resultBundlePath "$RUNNER_TEMP/LaunchTests.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/lecture-launch.log"
      - name: Build universal private-install IPA
        run: |
          set -o pipefail
          xcodebuild -project AppBuild/LectureTranscriber.xcodeproj -scheme LectureTranscriber -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/UniversalBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/lecture-device.log"
          python3 AppBuild/package_ipa.py "$RUNNER_TEMP/UniversalBuild/Build/Products/Debug-iphoneos/LectureTranscriber.app" "$RUNNER_TEMP/LectureTranscriber-v1.8.2.ipa"
          cp "$RUNNER_TEMP/LectureTranscriber-v1.8.2.ipa" "$RUNNER_TEMP/LectureTranscriber-1.8.2-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: LectureTranscriber-v1.8.2-IPA
          path: |
            ${{ runner.temp }}/LectureTranscriber-v1.8.2.ipa
            ${{ runner.temp }}/LectureTranscriber-1.8.2-unsigned.ipa
      - name: Create GitHub Release
        if: github.ref == 'refs/tags/v1.8.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.2
          files: |
            ${{ runner.temp }}/LectureTranscriber-v1.8.2.ipa
            Deliverables/update.json
            Deliverables/sidestore.json
          name: LectureTranscriber v1.8.2
          body: |
            ## LectureTranscriber v1.8.2 ("PiP Stability + Live Activity")
            - 修正 PiP 只顯示黑畫面的問題（修復 CVPixelBuffer 格式為 32BGRA、IOSurface 支援與 DisplayImmediately 立即顯示）
            - PiP 即時顯示原文與繁中翻譯，透過獨立 CaptionFeed 提供不中斷字幕流
            - 切換至其他 App（GoodNotes、Safari、PDF 等）背景錄音與即時辨識翻譯持續運作（≥60s）
            - 新增 3:1 / 5:1 / 6:1 字幕比例，預設使用 5:1 字幕條，支援雙語、僅翻譯、僅原文模式
            - 新增鎖定畫面 Live Activity（即時動態），系統原生計時器自動跳秒，顯示最新原文與翻譯
            - 新增 iPhone Dynamic Island（動態島）整合（Compact / Expanded）
            - 嚴格遵守 SideStore / Personal Team 側載架構：單一 Widget Extension，無 App Groups，無 APNs / Push，無 Home Screen Widget
          draft: false
          prerelease: false
      - name: Report validation errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, pathlib
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('lecture-*.log'):
              for line in p.read_text(errors='replace').splitlines():
                  if 'error:' in line.lower() or ('Test Case' in line and 'failed' in line):
                      print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lecture-build-log
          path: |
            ${{ runner.temp }}/lecture-build.log
            ${{ runner.temp }}/lecture-audio.log
            ${{ runner.temp }}/lecture-launch.log
            ${{ runner.temp }}/LaunchTests.xcresult

  sensevoice-native:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Core ML SenseVoice with public bilingual audio
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/SenseVoiceValidation/Sources"
          cp AppTests/SenseVoice/Package.swift "$RUNNER_TEMP/SenseVoiceValidation/Package.swift"
          cp AppTests/SenseVoice/Benchmark.swift Apps/LectureTranscriber.swiftpm/Sources/SenseVoiceEngine.swift Apps/LectureTranscriber.swiftpm/Sources/Session.swift Apps/LectureTranscriber.swiftpm/Sources/ResourceState.swift "$RUNNER_TEMP/SenseVoiceValidation/Sources/"
          python3 - <<'PY'
          import urllib.request, wave, pathlib, os, hashlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          url = 'https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/resolve/main/test_wavs/0.wav'
          data = urllib.request.urlopen(url).read()
          assert hashlib.sha256(data).hexdigest() == '7d93384ca14702cc584a7a33fe2fed92e89e708549161cb12ea38c916882103b'
          (root / 'bilingual.wav').write_bytes(data)
          with wave.open(str(root / 'bilingual.wav')) as w:
              assert w.getframerate() == 16000 and w.getnchannels() == 1 and w.getsampwidth() == 2
              (root / 'bilingual.pcm16').write_bytes(w.readframes(w.getnframes()))
          PY
          cd "$RUNNER_TEMP/SenseVoiceValidation"
          swift run -c release SenseVoiceValidation "$RUNNER_TEMP/bilingual.pcm16" "$RUNNER_TEMP/sensevoice-results.json" 2>&1 | tee "$RUNNER_TEMP/sensevoice-native.log"
      - name: Report SenseVoice errors
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, os
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sensevoice-native.log'
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  if 'error:' in line.lower():
                      print('::error::' + line.replace('%', '%25'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensevoice-coreml-benchmark
          path: |
            ${{ runner.temp }}/sensevoice-native.log
            ${{ runner.temp }}/sensevoice-results.json
