name: Lecture App Validation
on:
  push:
    branches: [playground-compatible]
    paths: ['Apps/**', 'AppBuild/**', 'AppTests/**', '.github/workflows/lecture-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Persistence and export checks
        run: |
          swiftc Apps/LectureTranscriber.swiftpm/Sources/Session.swift AppTests/main.swift -o "$RUNNER_TEMP/session-tests"
          "$RUNNER_TEMP/session-tests"
      - name: Generate Xcode validation project
        run: |
          brew install xcodegen
          xcodegen generate --spec AppBuild/project.yml
      - name: Build against actual WhisperKit on iOS
        run: |
          set -o pipefail
          xcodebuild -project AppBuild/LectureTranscriber.xcodeproj -scheme LectureTranscriber -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/LectureBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/lecture-build.log"
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lecture-build-log
          path: ${{ runner.temp }}/lecture-build.log
