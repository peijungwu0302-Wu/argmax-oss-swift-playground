name: LectureTranscriber
options:
  bundleIdPrefix: com.peijungwu0302
  deploymentTarget:
    iOS: "16.0"
packages:
  WhisperLibrary:
    url: https://github.com/peijungwu0302-Wu/argmax-oss-swift-playground.git
    exactVersion: 1.1.3
targets:
  LectureTranscriber:
    type: application
    platform: iOS
    sources:
      - ../Apps/LectureTranscriber.swiftpm/Sources
    dependencies:
      - package: WhisperLibrary
        product: WhisperKit
    info:
      path: LectureInfo.plist
      properties:
        CFBundleDisplayName: 課堂逐字稿
        CFBundleShortVersionString: "1.5.0"
        CFBundleVersion: "10"
        NSMicrophoneUsageDescription: 錄製課堂聲音，在這台裝置上產生逐字稿。
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.peijungwu0302.lecturetranscriber
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LectureInfo.plist
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "10"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 錄製課堂聲音，在這台裝置上產生逐字稿。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  LogicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../AppTests/Logic
    dependencies:
      - target: LectureTranscriber
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  LaunchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../AppTests/Launch
    dependencies:
      - target: LectureTranscriber
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  LectureTranscriber:
    build:
      targets:
        LectureTranscriber: all
    test:
      targets:
        - LogicTests
        - LaunchTests
