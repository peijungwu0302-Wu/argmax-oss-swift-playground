name: LectureTranscriber
options:
  bundleIdPrefix: com.peijungwu0302
  deploymentTarget:
    iOS: "16.0"
packages:
  WhisperLibrary:
    url: https://github.com/peijungwu0302-Wu/argmax-oss-swift-playground.git
    exactVersion: 1.1.3
targets:
  LectureTranscriber:
    type: application
    platform: iOS
    sources:
      - ../Apps/LectureTranscriber.swiftpm/Sources
    dependencies:
      - package: WhisperLibrary
        product: WhisperKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.peijungwu0302.lecturetranscriber
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 錄製課堂聲音，在這台裝置上產生逐字稿。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  LectureTranscriber:
    build:
      targets:
        LectureTranscriber: all
